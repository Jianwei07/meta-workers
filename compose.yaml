services:
  sandbox-image:
    build:
      context: .
      dockerfile: infra/sandbox.Dockerfile
    image: meta-workers-sandbox:local
    command: ["true"]

  backend:
    build:
      context: .
      dockerfile: infra/backend.Dockerfile
    depends_on:
      sandbox-image:
        condition: service_completed_successfully
    expose:
      - "8000"
    environment:
      DATA_DIR: /data
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6}
      OPENAI_MODEL_ALLOWLIST: ${OPENAI_MODEL_ALLOWLIST:-gpt-5.6}
      SANDBOX_IMAGE: meta-workers-sandbox:local
    volumes:
      - meta-workers-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: infra/frontend.Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:80"
    restart: unless-stopped

volumes:
  meta-workers-data:
