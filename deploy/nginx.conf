server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_buffering off;
    }

    location = /healthz {
        proxy_pass http://backend:8000/healthz;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
